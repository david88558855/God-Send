name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        working-directory: .
        env:
          CGO_ENABLED: 1
        run: wails build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Send-win-x64
          path: build/bin/God-Send.exe

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build AAR with gomobile-android
        working-directory: .
        run: |
          docker run --rm \
            -v "$(pwd):/work" \
            -w /work \
            makeworld/gomobile-android bind -target android -o god-send.aar ./mobile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Send-android
          path: god-send.aar