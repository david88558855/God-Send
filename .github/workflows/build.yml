name: Build God-Send

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '20'

jobs:
  # Windows x64 便携版构建
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Download Dependencies
        run: go mod download

      - name: Build Wails App (Portable)
        run: wails build -clean -s -skipbindings

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Send-windows-x64
          path: build/bin/God-Send.exe

  # Android ARM64 构建
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Download Dependencies
        run: go mod download

      - name: Build Android AAR
        run: |
          mkdir -p build
          gomobile bind -target=android/arm64 -o build/God-Send.aar ./cmd/android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: God-Send-android-arm64
          path: build/God-Send.aar