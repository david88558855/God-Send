<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>God-Send</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f5f7fa;--sidebar:#fff;--border:#e8ecf1;--accent:#4a90d9;--accent2:#357abd;--text:#2c3e50;--muted:#8e9bae;--hover:#f0f4f8;--active:#e8f0fe;--me-bg:#4a90d9;--me-text:#fff;--other-bg:#fff;--other-text:#2c3e50;--shadow-lg:0 8px 24px rgba(0,0,0,.08)}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;height:100%}
/* ===== SIDEBAR ===== */
.sidebar{width:300px;min-width:300px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;box-shadow:1px 0 4px rgba(0,0,0,.03);transition:transform .3s ease}
.sidebar-header{padding:16px 16px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.avatar-self{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-status{font-size:11px;color:#27ae60;display:flex;align-items:center;gap:4px;margin-top:1px}
.user-status::before{content:'';width:6px;height:6px;border-radius:50%;background:#27ae60}
.sidebar-search{padding:10px 12px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);width:14px;height:14px}
.search-box{width:100%;padding:8px 12px 8px 32px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;transition:border .2s}
.search-box:focus{border-color:var(--accent)}
.sidebar-tabs{display:flex;padding:2px 12px 0;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px 0;text-align:center;font-size:12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;transition:.2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab:hover{color:var(--text)}
.device-list{flex:1;overflow-y:auto;padding:6px;-webkit-overflow-scrolling:touch}
.device-list::-webkit-scrollbar{width:3px}
.device-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.device-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:background .15s;position:relative}
.device-item:hover{background:var(--hover)}
.device-item.active{background:var(--active)}
.device-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.device-avatar.online{background:linear-gradient(135deg,#4a90d9,#6c5ce7)}
.device-avatar.offline{background:#c8d6e5;color:#8e9bae}
.device-detail{flex:1;min-width:0}
.device-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.device-ip{font-size:10px;color:var(--muted);margin-top:1px}
.device-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.device-time{font-size:9px;color:var(--muted)}
.badge{background:var(--accent);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.status-dot{width:8px;height:8px;border-radius:50%;position:absolute;top:10px;left:42px;border:2px solid #fff}
.status-dot.online{background:#27ae60}
.status-dot.offline{background:#c8d6e5}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.footer-stat{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.footer-stat .dot{width:5px;height:5px;border-radius:50%;background:#27ae60}
.settings-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;transition:.2s}
.settings-btn:hover{color:var(--text);background:var(--hover)}
/* ===== CHAT AREA ===== */
.chat-area{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;min-width:0}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.04);z-index:1}
.chat-header-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4a90d9,#6c5ce7);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.chat-header-info{flex:1;min-width:0}
.chat-header-name{font-weight:600;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-header-status{font-size:11px;color:#27ae60;margin-top:1px}
.mobile-back-btn{display:none;background:none;border:none;color:var(--accent);cursor:pointer;padding:6px 8px;border-radius:6px;font-size:18px;line-height:1;transition:.2s}
.mobile-back-btn:hover{background:var(--hover)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;z-index:1;-webkit-overflow-scrolling:touch}
.chat-messages::-webkit-scrollbar{width:3px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.msg-row{display:flex;align-items:flex-end;gap:6px}
.msg-row.me{flex-direction:row-reverse}
.msg-bubble{max-width:65%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
.msg-row:not(.me) .msg-bubble{background:var(--other-bg);color:var(--other-text);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-row.me .msg-bubble{background:var(--me-bg);color:var(--me-text);border-bottom-right-radius:4px}
.msg-time{font-size:9px;color:var(--muted);margin-top:1px;padding:0 4px}
.msg-row.me .msg-time{text-align:right}
.msg-file{display:flex;align-items:center;gap:8px;padding:2px 0}
.msg-file:hover{opacity:.8}
.msg-file-icon{width:32px;height:32px;border-radius:6px;background:var(--hover);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.msg-file-info{flex:1;min-width:0}
.msg-file-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-file-size{font-size:10px;color:var(--muted)}
.msg-file-progress{margin-top:4px;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.msg-file-progress-bar{height:100%;border-radius:2px;background:var(--accent);transition:width .3s ease;min-width:0}
.msg-file-status{font-size:10px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:4px}
.msg-file-download{display:inline-flex;align-items:center;gap:4px;margin-top:4px;padding:4px 10px;border-radius:12px;background:var(--accent);color:#fff;font-size:11px;font-weight:500;text-decoration:none;cursor:pointer;transition:background .2s}
.msg-file-download:hover{background:var(--accent2)}
.msg-file-download svg{width:12px;height:12px}
.date-divider{text-align:center;padding:12px 0;font-size:11px;color:var(--muted);position:relative}
.date-divider::before,.date-divider::after{content:'';position:absolute;top:50%;width:calc(50% - 36px);height:1px;background:var(--border)}
.date-divider::before{left:0}
.date-divider::after{right:0}
.chat-input{padding:10px 12px;border-top:1px solid var(--border);display:flex;align-items:flex-end;gap:8px;background:#fff;z-index:2}
.input-actions{display:flex;gap:1px}
.input-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:7px;border-radius:6px;transition:.2s;display:flex;align-items:center;justify-content:center}
.input-btn:hover{color:var(--accent);background:var(--hover)}
.input-wrap{flex:1;position:relative}
.msg-input{width:100%;padding:9px 12px;border-radius:18px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;resize:none;max-height:100px;line-height:1.4;transition:border .2s}
.msg-input:focus{border-color:var(--accent)}
.msg-input::placeholder{color:var(--muted)}
.send-btn{padding:9px 16px;border-radius:18px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0}
.send-btn:hover{background:var(--accent2)}
.send-btn:active{transform:scale(.96)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);z-index:1;padding:20px}
.empty-icon{width:64px;height:64px;border-radius:50%;background:var(--active);display:flex;align-items:center;justify-content:center}
.empty-title{font-size:16px;font-weight:600;color:var(--text)}
.empty-desc{font-size:12px;text-align:center;max-width:260px;line-height:1.6}
/* ===== TOAST ===== */
.toast{position:fixed;top:16px;right:16px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);z-index:200;transform:translateX(120%);transition:transform .3s ease}
.toast.show{transform:translateX(0)}
.toast-icon{width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast-text{font-size:12px;color:var(--muted)}
.toast-title{font-weight:600;font-size:13px;color:var(--text)}
/* ===== SETTINGS ===== */
.settings-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:center;justify-content:center}
.settings-overlay.show{display:flex}
.settings-panel{background:#fff;border-radius:16px;padding:28px;width:400px;max-width:90vw;box-shadow:var(--shadow-lg)}
.settings-title{font-size:17px;font-weight:600;margin-bottom:20px;color:var(--text)}
.settings-group{margin-bottom:16px}
.settings-label{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;display:block}
.settings-input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border .2s}
.settings-input:focus{border-color:var(--accent)}
.settings-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.settings-save{padding:9px 20px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;font-size:13px;cursor:pointer;transition:.2s}
.settings-save:hover{background:var(--accent2)}
.settings-cancel{padding:9px 20px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:500;font-size:13px;cursor:pointer;transition:.2s}
.settings-cancel:hover{background:var(--hover)}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.switch-label{font-size:13px;color:var(--text)}
.switch-desc{font-size:10px;color:var(--muted);margin-top:2px}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.3s}
.switch .slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(20px)}
/* ===== MOBILE OVERLAY ===== */
.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:49}
.sidebar-overlay.show{display:block}
/* ===== MOBILE RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .3s ease;width:82vw;max-width:340px;min-width:0}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .chat-area{width:100%}
  .mobile-back-btn{display:flex;align-items:center;justify-content:center}
  .chat-header{padding:10px 12px;gap:8px}
  .chat-messages{padding:12px 10px}
  .chat-input{padding:8px 10px;gap:6px}
  .msg-bubble{max-width:78%;font-size:15px}
  .settings-panel{width:94vw;max-width:94vw;border-radius:12px;padding:20px 16px}
  .toast{top:8px;right:8px;left:8px;min-width:auto}
  .empty-desc{max-width:220px;font-size:11px}
  .send-btn span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="avatar-self" id="selfAvatar">我</div>
      <div class="user-info">
        <div class="user-name" id="selfName">我的设备</div>
        <div class="user-status">在线</div>
      </div>
      <button class="settings-btn" title="刷新设备" id="refreshBtn" style="margin-left:auto">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </div>
    <div class="sidebar-search">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input class="search-box" type="text" placeholder="搜索设备..." id="searchInput">
      </div>
    </div>
    <div class="sidebar-tabs">
      <div class="tab active" data-tab="all">全部</div>
    </div>
    <div class="device-list" id="deviceList"></div>
    <div class="sidebar-footer">
      <div class="footer-stat"><span class="dot"></span><span id="onlineCount">0 台在线</span></div>
      <button class="settings-btn" title="设置" id="settingsBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </div>
      <div class="empty-title">God-Send</div>
      <div class="empty-desc">选择设备开始聊天，同一局域网内的设备将自动发现</div>
    </div>
    <div id="chatView" style="display:none;flex-direction:column;flex:1">
      <div class="chat-header">
        <button class="mobile-back-btn" id="mobileBackBtn">&#8592;</button>
        <div class="chat-header-avatar" id="chatAvatar">?</div>
        <div class="chat-header-info">
          <div class="chat-header-name" id="chatName">设备</div>
          <div class="chat-header-status" id="chatStatus">在线</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <div class="input-actions">
          <button class="input-btn" title="发送文件" id="fileBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button class="input-btn" title="发送图片" id="imageBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          </button>
        </div>
        <div class="input-wrap">
          <textarea class="msg-input" id="msgInput" placeholder="输入消息..." rows="1"></textarea>
        </div>
        <button class="send-btn" id="sendBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          <span>发送</span>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <div class="settings-title">设置</div>
    <div class="settings-group">
      <label class="settings-label">设备名称</label>
      <input class="settings-input" id="settingName" type="text" placeholder="输入设备名称">
    </div>
    <div class="settings-group">
      <label class="settings-label">QUIC 端口</label>
      <input class="settings-input" id="settingPort" type="number" placeholder="端口号" min="1" max="65535">
    </div>
    <div class="settings-group">
      <label class="settings-label">文件保存路径</label>
      <input class="settings-input" id="settingSavePath" type="text" placeholder="文件保存路径">
    </div>
    <div class="settings-group">
      <label class="settings-label">网页版端口</label>
      <input class="settings-input" id="settingHTTPPort" type="number" placeholder="网页版端口" min="1" max="65535">
    </div>
    <div class="settings-group">
      <div class="switch-row">
        <div>
          <div class="switch-label">网页版模式</div>
          <div class="switch-desc">允许局域网内其他设备通过浏览器访问</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="settingWebMode">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="settings-actions">
      <button class="settings-cancel" id="settingsCancelBtn">取消</button>
      <button class="settings-save" id="settingsSaveBtn">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast">
  <div class="toast-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </div>
  <div>
    <div class="toast-title" id="toastTitle">新消息</div>
    <div class="toast-text" id="toastText">来自设备的消息</div>
  </div>
</div>
<input type="file" id="fileInput" style="display:none" multiple>
<input type="file" id="imageInput" style="display:none" accept="image/*" multiple>
<script>
var selfId = '';
var selfName = '我的设备';
var devices = [];
var chatData = {};
var activeDevice = null;
var ws = null;
var reconnectTimer = null;
var isMobile = window.innerWidth <= 768;
var fileProgress = {}; // fileId -> {received, total}

function isMobileView() { return window.innerWidth <= 768; }

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

var wsBaseUrl = ''; // 桌面端WS基础URL，为空则使用location.host

function connectWS() {
  var wsUrl;
  if (wsBaseUrl) {
    // 桌面端：直接连接本地HTTP服务
    wsUrl = 'ws://' + wsBaseUrl + '/ws';
  } else {
    // 浏览器：使用当前页面host
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    wsUrl = proto + '//' + location.host + '/ws';
  }
  ws = new WebSocket(wsUrl);
  ws.onopen = function() {
    console.log('WebSocket connected to ' + wsUrl);
    if (reconnectTimer) { clearInterval(reconnectTimer); reconnectTimer = null; }
    if (selfName && selfName !== '我的设备') {
      ws.send(JSON.stringify({type: 'join', data: {deviceName: selfName}}));
    }
  };
  ws.onmessage = function(e) {
    var msg = JSON.parse(e.data);
    handleWSMessage(msg);
  };
  ws.onclose = function() {
    console.log('WebSocket closed');
    if (!reconnectTimer) {
      reconnectTimer = setInterval(function() { connectWS(); }, 3000);
    }
  };
  ws.onerror = function() {};
}

function handleWSMessage(msg) {
  switch(msg.type) {
    case 'selfInfo':
      selfId = msg.data.deviceId;
      selfName = msg.data.deviceName;
      document.getElementById('selfName').textContent = selfName;
      document.getElementById('selfAvatar').textContent = selfName.charAt(0);
      document.getElementById('settingName').value = selfName;
      document.getElementById('settingPort').value = msg.data.port;
      document.getElementById('settingHTTPPort').value = msg.data.httpPort;
      document.getElementById('settingSavePath').value = msg.data.savePath;
      document.getElementById('settingWebMode').checked = msg.data.webMode || false;
      break;
    case 'devices':
      devices = msg.data || [];
      renderDeviceList();
      break;
    case 'newMessage':
      handleNewMessage(msg.data);
      break;
    case 'messageSent':
      break;
    case 'fileDone':
      var fd = msg.data || {};
      if (fd.fileId) {
        delete fileProgress[fd.fileId];
      }
      if (fd.fileUrl && fd.fileName) {
        showToast('文件接收完成', fd.fileName + ' 可点击下载');
      } else {
        showToast('文件传输', '文件传输完成');
      }
      break;
    case 'fileProgress':
      var fp = msg.data || {};
      if (fp.fileId) {
        fileProgress[fp.fileId] = { received: fp.received || 0, total: fp.total || 0 };
        // 实时更新当前聊天中的进度条
        if (activeDevice) {
          var progEl = document.getElementById('prog-' + fp.fileId);
          if (progEl) {
            var pct = 0;
            var statusText = '接收中';
            if (fp.total > 0) {
              pct = Math.min(100, Math.round(fp.received / fp.total * 100));
              statusText = '接收中 ' + pct + '%';
            } else {
              statusText = '接收中 ' + formatFileSize(fp.received);
            }
            progEl.style.width = pct + '%';
            var statusEl = document.getElementById('prog-status-' + fp.fileId);
            if (statusEl) statusEl.textContent = statusText;
          }
        }
      }
      break;
  }
}

function handleNewMessage(record) {
  var peerId = record.from;
  if (!chatData[peerId]) chatData[peerId] = [];
  // 如果是文件完成消息，更新之前的receiving记录
  if (record.fileId && record.fileUrl) {
    for (var i = chatData[peerId].length - 1; i >= 0; i--) {
      if (chatData[peerId][i].fileId === record.fileId && chatData[peerId][i].status === 'receiving') {
        chatData[peerId][i].status = 'delivered';
        chatData[peerId][i].fileUrl = record.fileUrl;
        if (peerId === activeDevice) renderMessages(peerId);
        return;
      }
    }
  }
  chatData[peerId].push(record);
  var dev = devices.find(function(d) { return d.id === peerId; });
  if (dev) {
    dev.lastMsg = record.type === 'file' ? '[文件] ' + (record.fileName || record.content) : record.content;
    dev.lastTime = formatTime(record.time);
    if (peerId !== activeDevice) dev.unread = (dev.unread || 0) + 1;
    renderDeviceList();
  }
  if (peerId === activeDevice) {
    renderMessages(peerId);
  } else {
    showToast('新消息', record.fromName + ': ' + (record.type === 'file' ? '[文件]' : record.content));
  }
}

function formatTime(ts) {
  if (!ts) return '';
  var d = new Date(ts);
  var now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function renderDeviceList() {
  var list = document.getElementById('deviceList');
  var search = document.getElementById('searchInput').value.toLowerCase();
  var filtered = devices.filter(function(d) {
    if (d.id === selfId) return false;
    return true;
  });
  if (search) filtered = filtered.filter(function(d) {
    return d.name.toLowerCase().indexOf(search) >= 0 || d.ip.indexOf(search) >= 0;
  });
  filtered.sort(function(a, b) {
    if (a.online !== b.online) return b.online - a.online;
    return 0;
  });
  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var d = filtered[i];
    html += '<div class="device-item ' + (activeDevice === d.id ? 'active' : '') + '" data-id="' + d.id + '">';
    html += '<div class="device-avatar ' + (d.online ? 'online' : 'offline') + '">' + escHtml(d.name.charAt(0) || '?') + '</div>';
    html += '<span class="status-dot ' + (d.online ? 'online' : 'offline') + '"></span>';
    html += '<div class="device-detail"><div class="device-name">' + escHtml(d.name) + '</div>';
    html += '<div class="device-ip">' + escHtml(d.ip) + (d.os ? ' &middot; ' + escHtml(d.os) : '') + '</div></div>';
    html += '<div class="device-meta"><span class="device-time">' + escHtml(d.lastTime || '') + '</span>';
    if (d.unread) html += '<span class="badge">' + d.unread + '</span>';
    html += '</div></div>';
  }
  list.innerHTML = html;
  var onlineCount = devices.filter(function(d) { return d.online && d.id !== selfId; }).length;
  document.getElementById('onlineCount').textContent = onlineCount + ' 台在线';
}

document.getElementById('deviceList').addEventListener('click', function(e) {
  var item = e.target.closest('.device-item');
  if (!item) return;
  selectDevice(item.dataset.id);
});

function selectDevice(id) {
  activeDevice = id;
  var dev = devices.find(function(d) { return d.id === id; });
  if (!dev) return;
  dev.unread = 0;
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatView').style.display = 'flex';
  document.getElementById('chatAvatar').textContent = dev.name.charAt(0) || '?';
  document.getElementById('chatName').textContent = dev.name;
  document.getElementById('chatStatus').textContent = dev.online ? '在线 \u00b7 ' + dev.ip : '离线 \u00b7 ' + dev.ip;
  document.getElementById('chatStatus').style.color = dev.online ? '#27ae60' : 'var(--muted)';
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'clearUnread', data: {deviceId: id}}));
  }
  fetch('/api/history/' + id).then(function(r) { return r.json(); }).then(function(data) {
    chatData[id] = data || [];
    renderMessages(id);
  }).catch(function() {
    renderMessages(id);
  });
  renderDeviceList();
  if (isMobileView()) closeSidebar();
}

// Mobile: back button
document.getElementById('mobileBackBtn').addEventListener('click', function() {
  activeDevice = null;
  document.getElementById('chatView').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
  openSidebar();
});

// Mobile: sidebar overlay click to close
document.getElementById('sidebarOverlay').addEventListener('click', closeSidebar);

// Mobile: tap empty state to open sidebar
document.getElementById('emptyState').addEventListener('click', function() {
  if (isMobileView()) openSidebar();
});
document.getElementById('emptyState').style.cursor = 'pointer';

function renderMessages(id) {
  var container = document.getElementById('chatMessages');
  var msgs = chatData[id] || [];
  if (!msgs.length) {
    container.innerHTML = '<div class="date-divider">暂无消息记录</div>';
    return;
  }
  var html = '<div class="date-divider">今天</div>';
  for (var i = 0; i < msgs.length; i++) {
    html += renderMessageBubble(msgs[i]);
  }
  container.innerHTML = html;
  container.scrollTop = container.scrollHeight;
}

function renderMessageBubble(m) {
  var isMe = m.from === selfId;
  var content = '';
  if (m.type === 'file' || m.type === 'image') {
    var icon = m.type === 'image' ?
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>' :
      '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
    var progressHtml = '';
    var downloadHtml = '';
    // 传输中：显示进度条
    if (m.status === 'sending' || m.status === 'receiving') {
      var pct = 0;
      var statusLabel = m.status === 'sending' ? '发送中' : '接收中';
      var prog = fileProgress[m.fileId];
      if (prog && prog.total > 0) {
        pct = Math.min(100, Math.round(prog.received / prog.total * 100));
        statusLabel += ' ' + pct + '%';
      } else if (prog && prog.received > 0) {
        statusLabel += ' ' + formatFileSize(prog.received);
      }
      var progId = m.fileId ? 'prog-' + m.fileId : '';
      var progStatusId = m.fileId ? 'prog-status-' + m.fileId : '';
      progressHtml = '<div class="msg-file-progress"><div class="msg-file-progress-bar" id="' + progId + '" style="width:' + pct + '%"></div></div>';
      progressHtml += '<div class="msg-file-status" id="' + progStatusId + '">' + statusLabel + '</div>';
    }
    // 传输完成且有下载链接：显示下载按钮
    if ((m.status === 'delivered' || m.status === 'sent') && m.fileUrl) {
      var url = m.fileUrl;
      if (wsBaseUrl && url.charAt(0) === '/') {
        url = 'http://' + wsBaseUrl + url;
      }
      downloadHtml = '<a class="msg-file-download" href="' + url + '" download="' + escHtml(m.fileName || m.content) + '"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>下载</a>';
    }
    // 桌面端：文件已自动保存到下载目录
    if (isMe && m.status === 'delivered' && !m.fileUrl) {
      downloadHtml = '<div class="msg-file-status">已保存</div>';
    }
    // 发送完成（自己发出的文件，无下载链接）
    if (isMe && m.status === 'sent' && !m.fileUrl) {
      downloadHtml = '<div class="msg-file-status">已发送</div>';
    }
    content = '<div class="msg-file"><div class="msg-file-icon">' + icon + '</div><div class="msg-file-info"><div class="msg-file-name">' + escHtml(m.fileName || m.content) + '</div><div class="msg-file-size">' + formatFileSize(m.fileSize || 0) + '</div>' + progressHtml + downloadHtml + '</div></div>';
  } else {
    content = escHtml(m.content);
  }
  return '<div class="msg-row ' + (isMe ? 'me' : '') + '"><div class="msg-bubble">' + content + '</div></div><div class="msg-time" style="' + (isMe ? 'text-align:right' : '') + '">' + formatTime(m.time) + '</div>';
}

function formatFileSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(1) + ' MB';
}

function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function sendMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text || !activeDevice) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'sendMessage', data: {to: activeDevice, content: text, type: 'text'}}));
  }
  if (!chatData[activeDevice]) chatData[activeDevice] = [];
  var now = Date.now();
  chatData[activeDevice].push({id: 'local-' + now, from: selfId, fromName: selfName, to: activeDevice, type: 'text', content: text, time: now, status: 'sending'});
  input.value = '';
  input.style.height = 'auto';
  renderMessages(activeDevice);
  var dev = devices.find(function(d) { return d.id === activeDevice; });
  if (dev) { dev.lastMsg = text; dev.lastTime = formatTime(now); renderDeviceList(); }
}

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 100) + 'px';
});

document.getElementById('fileBtn').addEventListener('click', function() {
  document.getElementById('fileInput').click();
});
document.getElementById('imageBtn').addEventListener('click', function() {
  document.getElementById('imageInput').click();
});
document.getElementById('fileInput').addEventListener('change', function() {
  uploadFiles(this.files, 'file');
  this.value = '';
});
document.getElementById('imageInput').addEventListener('change', function() {
  uploadFiles(this.files, 'image');
  this.value = '';
});

function uploadFiles(files, type) {
  if (!activeDevice || !files.length) return;
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      var formData = new FormData();
      formData.append('file', file);
      formData.append('to', activeDevice);
      formData.append('type', type);
      formData.append('fromId', selfId);
      formData.append('fromName', selfName);
      fetch('/api/upload', {method: 'POST', body: formData}).then(function(r) { return r.json(); }).then(function(data) {
        if (data.status === 'ok') {
          if (!chatData[activeDevice]) chatData[activeDevice] = [];
          chatData[activeDevice].push({id: data.fileId || 'local-' + Date.now(), from: selfId, fromName: selfName, to: activeDevice, type: type, content: file.name, fileName: file.name, fileSize: file.size, time: Date.now(), status: 'sending'});
          renderMessages(activeDevice);
          showToast('文件发送', '正在发送: ' + file.name);
        }
      });
    })(files[i]);
  }
}

document.getElementById('searchInput').addEventListener('input', renderDeviceList);

document.getElementById('settingsBtn').addEventListener('click', function() {
  // 打开设置时加载当前配置
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    document.getElementById('settingName').value = cfg.deviceName || '';
    document.getElementById('settingPort').value = cfg.port || '';
    document.getElementById('settingHTTPPort').value = cfg.httpPort || '';
    document.getElementById('settingSavePath').value = cfg.savePath || '';
    document.getElementById('settingWebMode').checked = cfg.webMode !== false;
  }).catch(function() {});
  document.getElementById('settingsOverlay').classList.add('show');
});
document.getElementById('settingsCancelBtn').addEventListener('click', function() {
  document.getElementById('settingsOverlay').classList.remove('show');
});
document.getElementById('settingsSaveBtn').addEventListener('click', function() {
  var name = document.getElementById('settingName').value;
  var port = parseInt(document.getElementById('settingPort').value);
  var httpPort = parseInt(document.getElementById('settingHTTPPort').value);
  var savePath = document.getElementById('settingSavePath').value;
  var webMode = document.getElementById('settingWebMode').checked;
  fetch('/api/config/update', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({deviceName: name, port: port, httpPort: httpPort, savePath: savePath, webMode: webMode})
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.status === 'ok') {
      selfName = name;
      document.getElementById('selfName').textContent = name;
      document.getElementById('selfAvatar').textContent = name.charAt(0) || '我';
      showToast('设置', '配置已保存');
      document.getElementById('settingsOverlay').classList.remove('show');
    }
  });
});

function showToast(title, text) {
  var toast = document.getElementById('toast');
  document.getElementById('toastTitle').textContent = title;
  document.getElementById('toastText').textContent = text;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 3000);
}

// Mobile: auto-open sidebar on load if mobile
window.addEventListener('resize', function() { isMobile = isMobileView(); });

// 检测运行环境并初始化WS连接
// Wails桌面端: location.host是wails.localhost(无端口)，需要直连本地HTTP服务
// 浏览器端: location.host包含端口，可直接使用
(function initWS() {
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    var httpPort = cfg.httpPort || 53334;
    // 判断是否为浏览器模式：location.port存在且等于httpPort
    if (location.port && parseInt(location.port) === httpPort) {
      // 浏览器模式 - WS通过当前页面host
      connectWS();
    } else {
      // 桌面/Wails模式 - WS直连本地HTTP服务
      wsBaseUrl = '127.0.0.1:' + httpPort;
      connectWS();
    }
  }).catch(function() {
    // 获取配置失败，尝试用location.host，失败后回退到默认端口
    if (location.port) {
      connectWS();
    } else {
      wsBaseUrl = '127.0.0.1:53334';
      connectWS();
    }
  });
})();

// 刷新设备列表（通过HTTP API）
function refreshDevices() {
  var url = '/api/devices';
  if (wsBaseUrl) {
    url = 'http://' + wsBaseUrl + '/api/devices';
  }
  fetch(url).then(function(r) { return r.json(); }).then(function(data) {
    devices = data || [];
    renderDeviceList();
  }).catch(function() {});
}

// 刷新按钮
document.getElementById('refreshBtn').addEventListener('click', function() {
  var btn = document.getElementById('refreshBtn');
  btn.style.transform = 'rotate(360deg)';
  btn.style.transition = 'transform 0.5s';
  setTimeout(function() { btn.style.transform = ''; btn.style.transition = ''; }, 500);
  refreshDevices();
});

// 自动轮询设备列表（每10秒，作为WS推送的补充）
setInterval(refreshDevices, 10000);

renderDeviceList();
if (isMobileView()) openSidebar();
</script>
</body>
</html>
